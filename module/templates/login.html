<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>登录 · Telegram Media Downloader</title>
    <meta name="theme-color" content="#2563eb">
    <link rel="icon" href="/static/icons/icon-192.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .safe-top { padding-top: env(safe-area-inset-top); }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center px-4 py-10 safe-top safe-bottom">
    <div class="w-full max-w-sm">
        <div class="flex items-center gap-3 justify-center mb-6">
            <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-lg flex items-center justify-center shadow-sm">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                </svg>
            </div>
            <div>
                <h1 class="text-lg font-semibold text-gray-900 leading-tight">Telegram Downloader</h1>
                <p class="text-xs text-gray-400">输入 config.yaml 里的登录密钥</p>
            </div>
        </div>

        <form method="post" action="/login" class="bg-white border border-gray-200 rounded-xl shadow-sm p-6">
            <input type="hidden" name="next" value="{{ next_url }}">
            <label for="password" class="block text-sm font-medium text-gray-700 mb-2">登录密钥</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required autofocus
                class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                placeholder="web_login_secret">
            {% if error %}
            <p class="mt-3 text-sm text-red-600" role="alert">{{ error }}</p>
            {% endif %}
            <button type="submit"
                class="mt-4 w-full rounded-lg bg-blue-500 hover:bg-blue-600 text-white text-sm font-medium py-2.5 transition-colors">
                登录
            </button>
        </form>
    </div>
</body>
</html>
